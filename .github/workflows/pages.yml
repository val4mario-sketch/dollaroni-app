# Pubblica Dollaroni su GitHub Pages a ogni push sul branch main.
# Il sito è preparato da tools/build_pwa.py: la versione nuova arriva da sola a chi usa l'app.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test nel browser (Chrome headless)
        run: python tools/run_tests_headless.py
      - name: Prepara il sito
        run: python tools/build_pwa.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
